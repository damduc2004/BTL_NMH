version: '3.8'

# ============================================================
# Docker Compose — Local development / smoke-test before K8s
# ============================================================

services:

  # ----------------------------------------------------------
  # MySQL for user-service
  # ----------------------------------------------------------
  mysql-user:
    image: mysql:8.0
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: "1"
      MYSQL_DATABASE: user_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # MySQL for product-service
  # ----------------------------------------------------------
  mysql-product:
    image: mysql:8.0
    container_name: mysql-product
    environment:
      MYSQL_ROOT_PASSWORD: "1"
      MYSQL_DATABASE: product_db
    ports:
      - "3307:3306"          # expose on 3307 to avoid conflict with local MySQL
    volumes:
      - mysql-product-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # MySQL for feedback-service
  # ----------------------------------------------------------
  mysql-feedback:
    image: mysql:8.0
    container_name: mysql-feedback
    environment:
      MYSQL_ROOT_PASSWORD: "1"
      MYSQL_DATABASE: feedback_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-feedback-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # user-service
  # ----------------------------------------------------------
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: demo/user-service:latest
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-user:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1"
    ports:
      - "8082:8082"
    depends_on:
      mysql-user:
        condition: service_healthy

  # ----------------------------------------------------------
  # product-service
  # ----------------------------------------------------------
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    image: demo/product-service:latest
    container_name: product-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-product:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1"
    ports:
      - "8081:8081"
    depends_on:
      mysql-product:
        condition: service_healthy

  # ----------------------------------------------------------
  # feedback-service
  # ----------------------------------------------------------
  feedback-service:
    build:
      context: .
      dockerfile: feedback-service/Dockerfile
    image: demo/feedback-service:latest
    container_name: feedback-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-feedback:3306/feedback_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1"
      PRODUCT_SERVICE_URL: "http://product-service:8081"
      USER_SERVICE_URL: "http://user-service:8082"
    ports:
      - "8083:8083"
    depends_on:
      mysql-feedback:
        condition: service_healthy

  # ----------------------------------------------------------
  # api-gateway
  # ----------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: demo/api-gateway:latest
    container_name: api-gateway
    environment:
      USER_SERVICE_URL:     "http://user-service:8082"
      PRODUCT_SERVICE_URL:  "http://product-service:8081"
      FEEDBACK_SERVICE_URL: "http://feedback-service:8083"
    ports:
      - "8888:8080"
    depends_on:
      - user-service
      - product-service
      - feedback-service

volumes:
  mysql-user-data:
  mysql-product-data:
  mysql-feedback-data:
