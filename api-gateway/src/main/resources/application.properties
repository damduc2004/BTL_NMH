spring.application.name=api-gateway
server.port=8080

# ===== User Service Routes (Data Provider) =====
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/customers/**

# ===== Product Service Routes =====
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**

spring.cloud.gateway.routes[2].id=product-pages
spring.cloud.gateway.routes[2].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[2].predicates[0]=Path=/,/products/**,/login,/logout

# ===== Feedback Service Routes =====
spring.cloud.gateway.routes[3].id=feedback-service
spring.cloud.gateway.routes[3].uri=${FEEDBACK_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/feedbacks/**
spring.cloud.gateway.routes[3].filters[0]=PreserveHostHeader

spring.cloud.gateway.routes[4].id=feedback-pages
spring.cloud.gateway.routes[4].uri=${FEEDBACK_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[4].predicates[0]=Path=/feedback/**
spring.cloud.gateway.routes[4].filters[0]=PreserveHostHeader

# Rewrite redirect Location headers to gateway host
spring.cloud.gateway.default-filters[0]=RewriteLocationResponseHeader=AS_IN_REQUEST,Location,,

# ===== Logging =====
logging.level.root=WARN
logging.level.org.springframework.cloud.gateway=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level [api-gateway] %logger{36} - %msg%n
