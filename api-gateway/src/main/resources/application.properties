spring.application.name=api-gateway
server.port=8080

# ===== User Service Routes =====
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/customers/**

# ===== Product Service Routes =====
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**

# ===== Feedback Service Routes =====
spring.cloud.gateway.routes[2].id=feedback-service
spring.cloud.gateway.routes[2].uri=${FEEDBACK_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/feedbacks/**

# ===== Frontend Service Routes (catch-all, must be last) =====
spring.cloud.gateway.routes[3].id=frontend
spring.cloud.gateway.routes[3].uri=${FRONTEND_URL:http://frontend:80}
spring.cloud.gateway.routes[3].predicates[0]=Path=/**

# Rewrite redirect Location headers to gateway host
spring.cloud.gateway.default-filters[0]=RewriteLocationResponseHeader=AS_IN_REQUEST,Location,,

# ===== Logging =====
logging.level.root=WARN
logging.level.org.springframework.cloud.gateway=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level [api-gateway] %logger{36} - %msg%n
