<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý sản phẩm – Product Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #222; min-height: 100vh; }

    .topbar {
      background: #222; color: #fff;
      padding: 0 32px; height: 52px; display: flex; align-items: center;
      justify-content: space-between;
    }
    .topbar a { color: rgba(255,255,255,.75); text-decoration: none; font-size: 13px; margin-right: 8px; }
    .topbar a:hover { color: #fff; }
    .topbar .brand { font-size: 16px; font-weight: 700; color: #fff; text-decoration: none; }

    .page { max-width: 1100px; margin: 28px auto; padding: 0 24px; }
    .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .page-header h2 { font-size: 18px; font-weight: 700; color: #111; }

    .toolbar {
      display: flex; align-items: center; gap: 10px;
      background: #fff; padding: 12px 16px; border-radius: 8px;
      border: 1px solid #e0e0e0; margin-bottom: 16px;
    }
    .toolbar input[type=text] {
      flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 13px; outline: none;
    }
    .toolbar input[type=text]:focus { border-color: #555; }

    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-primary { background: #222; color: #fff; }
    .btn-primary:hover { background: #444; }
    .btn-success { background: #444; color: #fff; }
    .btn-success:hover { background: #222; }
    .btn-danger { background: #555; color: #fff; }
    .btn-danger:hover { background: #333; }
    .btn-secondary { background: #eee; color: #444; border: 1px solid #ccc; }
    .btn-secondary:hover { background: #ddd; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .card-box { background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #fafafa; }
    th { padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid #e8e8e8; }
    td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #eee; color: #444; }
    .badge-blue { background: #eee; color: #444; }
    .tag { display: inline-block; padding: 2px 7px; background: #f0f0f0; border-radius: 4px; font-size: 11px; margin: 1px; color: #555; }
    .empty-state { text-align: center; padding: 48px; color: #aaa; font-size: 14px; }

    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; padding: 16px; flex-wrap: wrap;
    }
    .pagination button {
      min-width: 34px; height: 34px; border: 1px solid #ddd; background: #fff;
      border-radius: 6px; font-size: 13px; cursor: pointer; transition: all .15s;
    }
    .pagination button:hover { background: #f0f0f0; }
    .pagination button.active { background: #222; border-color: #222; color: #fff; font-weight: 700; }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }
    .page-info { font-size: 13px; color: #888; }

    #addPanel {
      display: none; background: #fff; border-radius: 8px;
      border: 1px solid #e0e0e0; padding: 24px 28px; margin-bottom: 20px;
    }
    #addPanel.open { display: block; }
    #addPanel h3 { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 13px; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #555; }
    .section-title { font-size: 12px; font-weight: 700; color: #666; margin: 16px 0 8px; padding-bottom: 5px; border-bottom: 1px solid #eee; text-transform: uppercase; letter-spacing: .4px; }
    .attr-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .attr-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; flex: 1; min-width: 0; }
    .attr-row input[type=checkbox] { width: 15px; height: 15px; flex-shrink: 0; }
    .attr-row .attr-name { flex: 1; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .attr-row input[type=text] { flex: 1.2; padding: 6px 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px; }
    .extra-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .extra-row input { flex: 1; padding: 6px 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px; }
    .btn-remove { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ccc; background: #f5f5f5; color: #666; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .btn-remove:hover { background: #e0e0e0; }
    .form-actions { display: flex; gap: 10px; margin-top: 20px; }
    #fixedAttrsSection { display: none; }
    #formError { display: none; color: #b00; font-size: 13px; margin-top: 10px; }

    .toast { position: fixed; bottom: 24px; right: 24px; padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; color: #fff; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9999; }
    .toast.show { opacity: 1; pointer-events: auto; }
    .toast.ok { background: #333; }
    .toast.err { background: #b00; }
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <a href="/index.html">← Trang chủ</a>
      <span class="brand">Quản lý sản phẩm</span>
    </div>
    <span style="font-size:14px;opacity:.9">Admin</span>
  </div>

  <div class="page">
    <div class="page-header"><h2>Danh sách sản phẩm</h2></div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm hoặc danh mục..." />
      <button class="btn btn-primary" onclick="doSearch()">Tìm kiếm</button>
      <button class="btn btn-success" onclick="openAddForm()">+ Thêm mới</button>
    </div>

    <!-- ADD FORM -->
    <div id="addPanel">
      <h3>Thêm sản phẩm mới</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Tên sản phẩm <span style="color:red">*</span></label>
          <input type="text" id="fName" placeholder="VD: iPhone 15 Pro" />
        </div>
        <div class="form-group">
          <label>Giá (VNĐ) <span style="color:red">*</span></label>
          <input type="number" id="fPrice" placeholder="VD: 25000000" min="0" />
        </div>
        <div class="form-group">
          <label>Số lượng tồn kho</label>
          <input type="number" id="fStock" placeholder="VD: 100" min="0" value="0" />
        </div>
      </div>
      <div class="form-group" style="max-width:340px">
        <label>Danh mục <span style="color:red">*</span></label>
        <select id="fCategory" onchange="loadFixedAttrs(this.value)">
          <option value="">-- Chọn danh mục --</option>
        </select>
      </div>
      <div id="fixedAttrsSection">
        <div class="section-title">Thuộc tính danh mục</div>
        <div id="fixedAttrsList"></div>
      </div>
      <div class="section-title">Thuộc tính tùy chỉnh</div>
      <div id="extraAttrsList"></div>
      <button class="btn btn-secondary btn-sm" onclick="addExtraRow()" style="margin-top:4px">+ Thêm thuộc tính</button>
      <div class="form-actions">
        <button class="btn btn-success" onclick="saveProduct()">Lưu sản phẩm</button>
        <button class="btn btn-secondary" onclick="closeAddForm()">Hủy</button>
      </div>
      <div id="formError"></div>
    </div>

    <!-- TABLE -->
    <div class="card-box">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Tên sản phẩm</th><th>Giá</th><th>Tồn kho</th><th>Danh mục</th><th>Thuộc tính</th><th></th>
          </tr>
        </thead>
        <tbody id="productTableBody">
          <tr><td colspan="7" class="empty-state">Đang tải...</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="paginationBar"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/products.js"></script>
</body>
</html>
